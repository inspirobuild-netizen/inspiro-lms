name: inspiro_mobile
description: Civil Connect LMS — Inspiro student app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & state
  dio: ^5.4.3
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.4
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.2.3
  go_router: ^14.2.7

  # Video player
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Live class
  # Pinned: 6.5.4 is the version proven to build on iOS under CocoaPods.
  # A floating range is how the SPM header break reached us in the first place.
  agora_rtc_engine: 6.5.4

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  intl: ^0.19.0
  # Renders the server-built upi:// deep link as a scannable QR at enrol time.
  qr_flutter: ^4.1.0

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Phone sign-in. Firebase sends and verifies the SMS itself, which avoids
  # India's DLT template registration that a self-hosted OTP would need.
  firebase_auth: ^5.3.1
  flutter_local_notifications: ^18.0.0

  # Utils
  jwt_decoder: ^2.0.1
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# ── App icon (rounded adaptive) — run: dart run flutter_launcher_icons ─────────
flutter_launcher_icons:
  android: true
  ios: true
  # App Store rejects icons containing an alpha channel, and the source is
  # RGBA — this flattens it for the iOS set only.
  remove_alpha_ios: true
  # Square icon source (generated from the logo — see scripts/make_icon).
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 23

# ── Native splash — run: dart run flutter_native_splash:create ────────────────
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/app_icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/app_icon_foreground.png
  android: true
  ios: false
  fullscreen: true
