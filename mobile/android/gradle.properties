org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation — its cache (.tab files) intermittently
# fails to close on Windows (antivirus/file-lock race), breaking release builds.
kotlin.incremental=false
# sqflite_android needs compileSdk 36; AGP 8.7 officially tops out at 35. This
# only silences the "untested compileSdk" warning — 36 still compiles fine.
android.suppressUnsupportedCompileSdk=36
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
