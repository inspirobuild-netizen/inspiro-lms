services:
  nginx:
    image: nginx:alpine
    container_name: inspiro-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/inspiro.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    container_name: inspiro-api
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      AI_SERVICE_URL: http://ai:8000
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: always

  # Internal only — never expose through nginx; the Node API is its sole caller
  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: inspiro-ai
    expose:
      - '8000'
    environment:
      ENVIRONMENT: production
    env_file:
      - .env.production
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: inspiro-redis
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  redis_data:
