upstream api {
    server api:3000;
    keepalive 32;
}

# Redirect HTTP → HTTPS — except Let's Encrypt's challenge.
#
# The certificate renews over HTTP-01 through this server block: certbot writes
# the challenge into /var/www/certbot on the host, mounted here read-only.
# It used to renew with certbot's "standalone" mode, which needs port 80 to
# itself — impossible while this container holds it — so every renewal failed
# and the certificate expired on 5 Oct 2026, taking the app and admin down.
server {
    listen 80;
    server_name api.inspiroiasacademy.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www.inspiroiasacademy.in — redirect only, to the website at the apex.
#
# The website itself is hosted by another company on Vercel. Its www address
# used to be served there too, under a wildcard certificate Vercel could not
# renew while the domain's DNS is at GoDaddy, and it expired on 14 Aug 2026 —
# Chrome blocked every visitor arriving on www. Since 21 Oct 2026 the www DNS
# record points here instead: this server holds a normal certificate for www
# (renewed through the same webroot as the API's) and only redirects.
server {
    listen 80;
    server_name www.inspiroiasacademy.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://inspiroiasacademy.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.inspiroiasacademy.in;

    ssl_certificate     /etc/letsencrypt/live/www.inspiroiasacademy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.inspiroiasacademy.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://inspiroiasacademy.in$request_uri;
}

# API — api.inspiroiasacademy.in
server {
    listen 443 ssl http2;
    server_name api.inspiroiasacademy.in;

    ssl_certificate     /etc/letsencrypt/live/api.inspiroiasacademy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.inspiroiasacademy.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limit zone (defined in nginx.conf main block)
    # limit_req zone=api burst=20 nodelay;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # WebSocket for live class chat
    location /socket.io/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
