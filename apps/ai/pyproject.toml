[project]
name = "inspiro-ai"
version = "0.1.0"
description = "Inspiro LMS AI microservice — doubt resolver, exam generator, current affairs"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# LLM prompt strings and test fixtures read better unwrapped
"app/routers/*" = ["E501"]
"tests/*" = ["E501"]
