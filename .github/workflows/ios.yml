name: iOS

# Split from ci.yml because this needs a macOS runner, which is billed at a
# higher rate than ubuntu — so it runs only when the app or this workflow
# actually changes, plus on demand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    name: iOS — build (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - run: flutter pub get

      # No Firebase secret step: config comes from the committed
      # lib/firebase_options.dart, so iOS needs no GoogleService-Info.plist.

      # --no-codesign proves the app and all its native pods compile on iOS
      # without needing an Apple account. Signing is added in the release job
      # below once certificates exist.
      - name: Build (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Report app size
        run: du -sh build/ios/iphoneos/Runner.app || true

      # The Podfile is generated by the first build on macOS and is not in the
      # repo yet. Surface it so it can be committed and pinned deliberately.
      - name: Upload generated Podfile / Podfile.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfiles
          path: |
            mobile/ios/Podfile
            mobile/ios/Podfile.lock
          if-no-files-found: warn

  # Signed TestFlight upload. Stays skipped until the Apple credentials are
  # added as repository secrets, so the workflow above keeps proving the build
  # in the meantime rather than failing red on every run.
  testflight:
    name: iOS — TestFlight
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check credentials are configured
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::error::iOS signing secrets are not configured yet. Required: IOS_DIST_CERT_P12_B64, IOS_DIST_CERT_PASSWORD, IOS_PROVISIONING_PROFILE_B64, APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_PRIVATE_KEY."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Import signing certificate and profile
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "$CERT_B64" | base64 --decode > $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/inspiro.mobileprovision

          rm -f $RUNNER_TEMP/dist.p12

      - name: Build signed IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -rf ~/private_keys
