name: iOS

# Split from ci.yml because this needs a macOS runner, which is billed at a
# higher rate than ubuntu — so it runs only when the app or this workflow
# actually changes, plus on demand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    name: iOS — build (unsigned)
    # macos-26 for the iOS 26 SDK. App Store Connect rejects uploads built
    # with an older SDK, and matching the release job here means SDK problems
    # surface on a normal push rather than at upload time.
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Flutter version
        run: flutter --version

      # Flutter 3.44's `flutter create` produces an SPM-enabled iOS project, but
      # agora_rtc_engine 6.5.x does not build that way — Xcode cannot find
      # AgoraRtcWrapper/AgoraPIPController.h. flutter_local_notifications,
      # media_kit_libs_ios_video and media_kit_video don't support SPM at all
      # (the build logs them explicitly), so CocoaPods is the only integration
      # this plugin set works on. Revisit once Agora ships SPM support.
      - name: Use CocoaPods instead of Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - run: flutter pub get

      # No Firebase secret step: config comes from the committed
      # lib/firebase_options.dart, so iOS needs no GoogleService-Info.plist.

      # --no-codesign proves the app and all its native pods compile on iOS
      # without needing an Apple account.
      - name: Build (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Report app size
        run: du -sh build/ios/iphoneos/Runner.app || true

      # Podfile.lock is generated by the build and is not in the repo yet.
      # Surface it so it can be committed and the pod set pinned deliberately.
      - name: Upload generated Podfile / Podfile.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfiles
          path: |
            mobile/ios/Podfile
            mobile/ios/Podfile.lock
          if-no-files-found: warn

  # Signed TestFlight upload.
  #
  # Deliberately mirrors the pipeline already shipping the Kinvo and CampusOne
  # apps rather than inventing one: signing files are fetched (or created) from
  # App Store Connect with the Codemagic CLI, so there is no .p12 to export by
  # hand, no provisioning profile to base64, and no keychain wrangling. Four
  # secrets instead of six, and all four are APPLE ACCOUNT level rather than
  # per-app — the same values already used for the other apps work here
  # unchanged. `--create` registers the App ID and profile for this bundle on
  # the first run.
  testflight:
    name: iOS — TestFlight
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60

    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APPSTORE_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_API_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      BUNDLE_ID: com.bizence.inspiro

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Check credentials are configured
        env:
          KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Apple credentials are not configured. Required repository secrets: APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_API_KEY, CERTIFICATE_PRIVATE_KEY. All four are Apple-account level and can be copied from the repo that ships the other apps."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: Install Codemagic CLI tools
        run: pipx install codemagic-cli-tools

      - name: Use CocoaPods instead of Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - run: flutter pub get

      - name: Initialize keychain
        run: keychain initialize

      - name: Fetch or create signing files (certificate + provisioning profile)
        run: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

      - name: Add certificates to keychain
        run: keychain add-certificates

      - name: Apply provisioning profiles to Xcode project
        run: xcode-project use-profiles

      # API_BASE_URL, not API_URL — api_client.dart reads that name, and a
      # mismatch silently ships a build pointing at the emulator default.
      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=https://api.inspiroiasacademy.in \
            --export-options-plist="$HOME/export_options.plist"

      - name: Upload to TestFlight
        run: app-store-connect publish --path "build/ios/ipa/*.ipa"

      - name: Upload IPA as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspiro-ipa
          path: mobile/build/ios/ipa/*.ipa
          retention-days: 30
